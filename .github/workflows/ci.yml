name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --group dev
      - run: uv run ruff check src/
      - run: uv run ruff format --check src/
    permissions:
      contents: read
    timeout-minutes: 60
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --group dev
      - run: uv run mypy src/
    permissions:
      contents: read
    timeout-minutes: 60
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
      - run: uv sync --group dev --group release --locked
      - run: uv run pytest
      - run: uv run pyinstaller --clean --noconfirm it2ag.spec
      - run: test -x ./dist/it2ag/it2ag
      - run: test -d ./dist/it2ag/_internal
      - run: ./dist/it2ag/it2ag --help >/dev/null
      - run: ./dist/it2ag/it2ag --version | grep "^it2ag "
    permissions:
      contents: read
    timeout-minutes: 60
